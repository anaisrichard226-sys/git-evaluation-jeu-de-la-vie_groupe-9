name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Tester les options
        run: sh check_script_options.sh

      - name: Tester les grilles
        run: sh check_tests.sh